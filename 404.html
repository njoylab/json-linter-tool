<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | JSON Linter</title>
    <meta name="robots" content="noindex, follow">
    <link rel="canonical" href="https://jsonlint.echovalue.dev/">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.json">
    <style>
        :root {
            --primary-color: #007bff;
            --text-color: #333;
            --muted-color: #666;
            --background: #f9f9f9;
            --card: #ffffff;
            --border: #e2e2e2;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --primary-color: #1e90ff;
                --text-color: #f1f1f1;
                --muted-color: #b0b0b0;
                --background: #1c1c1c;
                --card: #262626;
                --border: #3a3a3a;
            }
        }

        *,
        *:before,
        *:after {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: Verdana, Arial, sans-serif;
            background-color: var(--background);
            color: var(--text-color);
        }

        main {
            width: 100%;
            max-width: 520px;
            padding: 40px 32px;
            background-color: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            text-align: center;
        }

        .code {
            margin: 0 0 8px 0;
            font-family: 'Courier New', monospace;
            font-size: 64px;
            font-weight: 700;
            line-height: 1;
            color: var(--primary-color);
        }

        h1 {
            margin: 0 0 12px 0;
            font-size: 22px;
        }

        p {
            margin: 0 0 24px 0;
            line-height: 1.6;
            color: var(--muted-color);
        }

        nav {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        a {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 4px;
            border: 1px solid var(--primary-color);
            color: var(--primary-color);
            font-size: 13px;
            text-decoration: none;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        a.primary {
            background-color: var(--primary-color);
            color: #fff;
        }

        a:hover {
            background-color: var(--primary-color);
            color: #fff;
        }
    </style>
</head>

<body>
    <main>
        <p class="code">{ 404 }</p>
        <h1>Page not found</h1>
        <p>The page you requested does not exist. It may have been moved or removed.</p>
        <nav>
            <a class="primary" href="/">JSON Linter</a>
            <a href="/jq-playground/">jq Playground</a>
            <a href="https://github.com/njoylab/json-linter-tool" rel="noopener">GitHub</a>
        </nav>
    </main>
</body>

</html>
